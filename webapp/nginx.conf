server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Health check
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Proxy for S3 images to avoid CORS issues
    location /s3-proxy/ {
        resolver 8.8.8.8 valid=300s;

        # Remove /s3-proxy/ prefix and proxy to S3
        rewrite ^/s3-proxy/(.*)$ /$1 break;

        proxy_pass https://storage.yandexcloud.net;
        proxy_http_version 1.1;
        proxy_set_header Host storage.yandexcloud.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;

        # Cache proxied images
        proxy_cache_valid 200 24h;
        expires 24h;
        add_header Cache-Control "public, immutable";
        add_header X-Proxy-Cache $upstream_cache_status;
    }

    # Handle /app prefix - strip it and serve files
    location /app {
        alias /usr/share/nginx/html;

        # Don't cache HTML files to ensure latest JS/CSS references
        # Cache static assets (with hash in filename - safe to cache long-term)
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # JS/CSS files - use short cache with revalidation
        # Vite adds hashes to filenames, so browser will request new files on update
        location ~* \.(js|css)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # SPA fallback - serve index.html for all routes under /app
        try_files $uri $uri/ /index.html;
    }

    # Fallback for root
    location / {
        # Redirect root to /app
        return 301 /app$request_uri;
    }
}
